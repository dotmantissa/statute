<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ee1ff" />
      <stop offset="100%" stop-color="#26ccf0" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00182b" />
      <stop offset="100%" stop-color="#002139" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Badge -->
  <rect width="128" height="128" rx="28" fill="url(#navyGrad)" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#26ccf0" stroke-width="2.5" stroke-opacity="0.35" />

  <!-- Cryptographic Lattice Nodes in Background -->
  <circle cx="64" cy="24" r="3" fill="#26ccf0" fill-opacity="0.6" />
  <circle cx="28" cy="74" r="2.5" fill="#26ccf0" fill-opacity="0.4" />
  <circle cx="100" cy="74" r="2.5" fill="#26ccf0" fill-opacity="0.4" />

  <!-- Central Column / Pillar of Law -->
  <path d="M62 34 L66 34 L65 96 L63 96 Z" fill="#ffffff" fill-opacity="0.95" />
  
  <!-- Pedestal Base -->
  <rect x="46" y="96" width="36" height="5" rx="2" fill="#ffffff" />
  <rect x="40" y="101" width="48" height="4" rx="2" fill="url(#cyanGrad)" />

  <!-- Fulcrum Top Diamond / Consensus Node -->
  <polygon points="64,28 70,36 64,44 58,36" fill="url(#cyanGrad)" filter="url(#glow)" />
  <circle cx="64" cy="36" r="2" fill="#002139" />

  <!-- Main Balance Crossbeam -->
  <path d="M26 44 Q64 41 102 44" fill="none" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Left Scale Chains -->
  <line x1="28" y1="45" x2="16" y2="72" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.85" />
  <line x1="28" y1="45" x2="40" y2="72" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.85" />
  <!-- Left Pan (Curved Dish) -->
  <path d="M12 72 Q28 84 44 72 Z" fill="url(#cyanGrad)" />
  <circle cx="28" cy="73" r="3.5" fill="#ffffff" />

  <!-- Right Scale Chains -->
  <line x1="100" y1="45" x2="88" y2="72" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.85" />
  <line x1="100" y1="45" x2="112" y2="72" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.85" />
  <!-- Right Pan (Curved Dish) -->
  <path d="M84 72 Q100 84 116 72 Z" fill="url(#cyanGrad)" />
  <circle cx="100" cy="73" r="3.5" fill="#ffffff" />

  <!-- Accent Consensus Connection Lines -->
  <line x1="28" y1="73" x2="64" y2="98" stroke="#26ccf0" stroke-width="1.2" stroke-dasharray="2,2" stroke-opacity="0.45" />
  <line x1="100" y1="73" x2="64" y2="98" stroke="#26ccf0" stroke-width="1.2" stroke-dasharray="2,2" stroke-opacity="0.45" />
</svg>
